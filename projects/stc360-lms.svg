<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0D1117"/>
  <defs>
    <linearGradient id="lms-glow" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF2D20" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#315CFF" stop-opacity="0.12"/>
    </linearGradient>
    <pattern id="lms-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="750" fill="url(#lms-grid)"/>
  <rect width="1200" height="750" fill="url(#lms-glow)"/>

  <!-- Application Window -->
  <g transform="translate(100, 75)">
    <rect width="1000" height="600" rx="12" fill="#161B22" stroke="#30363D" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect width="1000" height="44" rx="12" fill="#21262D"/>
    <circle cx="28" cy="22" r="6" fill="#EF4444"/>
    <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="22" r="6" fill="#10B981"/>
    <rect x="250" y="10" width="500" height="24" rx="6" fill="#0D1117"/>
    <text x="500" y="26" fill="#8B949E" font-family="monospace" font-size="12" text-anchor="middle">https://stc360.co • Laravel 10 LMS</text>

    <!-- Sidebar & Content -->
    <rect x="20" y="64" width="220" height="516" rx="8" fill="#0D1117" stroke="#30363D"/>
    <!-- Sidebar Items -->
    <text x="40" y="105" fill="#FF2D20" font-family="sans-serif" font-weight="700" font-size="16">STC360 PORTAL</text>
    <rect x="35" y="130" width="190" height="36" rx="6" fill="#21262D"/>
    <text x="50" y="153" fill="#FFFFFF" font-family="sans-serif" font-size="13">Course Analytics</text>
    <text x="50" y="195" fill="#8B949E" font-family="sans-serif" font-size="13">Student Registry</text>
    <text x="50" y="235" fill="#8B949E" font-family="sans-serif" font-size="13">Exam Grading</text>
    <text x="50" y="275" fill="#8B949E" font-family="sans-serif" font-size="13">Certificate Queues</text>

    <!-- Main Content Area -->
    <g transform="translate(260, 64)">
      <!-- Top Metric Cards -->
      <g transform="translate(0, 0)">
        <rect width="220" height="100" rx="8" fill="#0D1117" stroke="#30363D"/>
        <text x="20" y="32" fill="#8B949E" font-family="sans-serif" font-size="12">ACTIVE STUDENTS</text>
        <text x="20" y="70" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="28">12,480</text>
      </g>
      <g transform="translate(240, 0)">
        <rect width="220" height="100" rx="8" fill="#0D1117" stroke="#30363D"/>
        <text x="20" y="32" fill="#8B949E" font-family="sans-serif" font-size="12">CERTIFICATES ISSUED</text>
        <text x="20" y="70" fill="#10B981" font-family="sans-serif" font-weight="700" font-size="28">8,920</text>
      </g>
      <g transform="translate(480, 0)">
        <rect width="240" height="100" rx="8" fill="#0D1117" stroke="#30363D"/>
        <text x="20" y="32" fill="#8B949E" font-family="sans-serif" font-size="12">REDIS QUEUE LATENCY</text>
        <text x="20" y="70" fill="#58A6FF" font-family="sans-serif" font-weight="700" font-size="28">14ms</text>
      </g>

      <!-- Code & Database Schema Block -->
      <g transform="translate(0, 120)">
        <rect width="720" height="240" rx="8" fill="#0D1117" stroke="#30363D"/>
        <text x="24" y="34" fill="#58A6FF" font-family="monospace" font-size="13">// Laravel Job: GenerateCertificatePdf.php</text>
        <text x="24" y="65" fill="#FF7B72" font-family="monospace" font-size="13">class</text>
        <text x="75" y="65" fill="#FFA657" font-family="monospace" font-size="13">GenerateCertificatePdf</text>
        <text x="260" y="65" fill="#FF7B72" font-family="monospace" font-size="13">implements</text>
        <text x="355" y="65" fill="#79C0FF" font-family="monospace" font-size="13">ShouldQueue {</text>
        
        <text x="44" y="98" fill="#C9D1D9" font-family="monospace" font-size="13">use Dispatchable, InteractsWithQueue, Queueable, SerializesModels;</text>
        <text x="44" y="130" fill="#FF7B72" font-family="monospace" font-size="13">public function</text>
        <text x="175" y="130" fill="#D2A8FF" font-family="monospace" font-size="13">handle(CertificateService $service)</text>
        <text x="465" y="130" fill="#79C0FF" font-family="monospace" font-size="13">{</text>
        <text x="64" y="162" fill="#C9D1D9" font-family="monospace" font-size="13">$pdf = $service-&gt;render($this-&gt;student, $this-&gt;examScore);</text>
        <text x="64" y="194" fill="#C9D1D9" font-family="monospace" font-size="13">Storage::disk('s3')-&gt;put("certs/{$this-&gt;uuid}.pdf", $pdf);</text>
        <text x="44" y="224" fill="#79C0FF" font-family="monospace" font-size="13">}</text>
      </g>

      <!-- Bottom Feature Pills -->
      <g transform="translate(0, 380)">
        <rect width="720" height="136" rx="8" fill="#0D1117" stroke="#30363D"/>
        <text x="24" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="15">System Engineering Highlights</text>
        <text x="24" y="64" fill="#8B949E" font-family="sans-serif" font-size="13">• Normalized relational schema: Users, Courses, Modules, Quizzes, Submissions, Certificates.</text>
        <text x="24" y="92" fill="#8B949E" font-family="sans-serif" font-size="13">• Background worker dispatching 10,000+ verification emails without blocking HTTP threads.</text>
        <text x="24" y="120" fill="#8B949E" font-family="sans-serif" font-size="13">• Automated cryptographic hash validation on issued certificates for institutional verification.</text>
      </g>
    </g>
  </g>
</svg>

