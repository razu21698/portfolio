<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0D1117"/>
  <rect x="80" y="80" width="1040" height="590" rx="16" fill="#161B22" stroke="#30363D" stroke-width="2"/>
  
  <text x="140" y="145" fill="#FF7B72" font-family="monospace" font-size="14" font-weight="600">LARAVEL QUEUE &amp; DATABASE ARCHITECTURE</text>
  <text x="140" y="190" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="30">Asynchronous Exam &amp; Certification Engine</text>

  <!-- Flowchart Diagram -->
  <g transform="translate(140, 240)">
    <!-- Node 1 -->
    <rect width="200" height="130" rx="8" fill="#21262D" stroke="#30363D"/>
    <text x="20" y="35" fill="#58A6FF" font-family="monospace" font-size="12">1. CLIENT ACTION</text>
    <text x="20" y="68" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Submit Exam</text>
    <text x="20" y="98" fill="#8B949E" font-family="sans-serif" font-size="12">Sanitized POST request</text>

    <!-- Node 2 -->
    <g transform="translate(250, 0)">
      <rect width="220" height="130" rx="8" fill="#21262D" stroke="#FF7B72"/>
      <text x="20" y="35" fill="#FF7B72" font-family="monospace" font-size="12">2. CONTROLLER</text>
      <text x="20" y="68" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Atomic Transaction</text>
      <text x="20" y="98" fill="#8B949E" font-family="sans-serif" font-size="12">Scores evaluated in-memory</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(520, 0)">
      <rect width="200" height="130" rx="8" fill="#21262D" stroke="#30363D"/>
      <text x="20" y="35" fill="#7EE787" font-family="monospace" font-size="12">3. REDIS QUEUE</text>
      <text x="20" y="68" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Async Worker</text>
      <text x="20" y="98" fill="#8B949E" font-family="sans-serif" font-size="12">Generates PDF certificate</text>
    </g>

    <!-- Node 4 -->
    <g transform="translate(770, 0)">
      <rect width="200" height="130" rx="8" fill="#21262D" stroke="#30363D"/>
      <text x="20" y="35" fill="#D2A8FF" font-family="monospace" font-size="12">4. STORAGE &amp; SENDER</text>
      <text x="20" y="68" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Signed S3 URL</text>
      <text x="20" y="98" fill="#8B949E" font-family="sans-serif" font-size="12">Student notified via mail</text>
    </g>
  </g>

  <!-- Technical Schema Table -->
  <g transform="translate(140, 420)">
    <rect width="920" height="200" rx="10" fill="#0D1117" stroke="#30363D"/>
    <text x="30" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="16">Key Performance &amp; Integrity Benchmarks</text>
    
    <text x="30" y="75" fill="#8B949E" font-family="monospace" font-size="13">Database Transactions:</text>
    <text x="240" y="75" fill="#7EE787" font-family="monospace" font-size="13">DB::transaction() ensures zero partial records on network disconnect</text>

    <text x="30" y="110" fill="#8B949E" font-family="monospace" font-size="13">Concurrent Exam Takers:</text>
    <text x="240" y="110" fill="#FFFFFF" font-family="monospace" font-size="13">Tested under load with 2,500 simultaneous test submissions without timeout</text>

    <text x="30" y="145" fill="#8B949E" font-family="monospace" font-size="13">PDF Generation Latency:</text>
    <text x="240" y="145" fill="#58A6FF" font-family="monospace" font-size="13">Offloaded to background daemon, user UI remains 100% responsive (&lt; 150ms HTTP)</text>

    <text x="30" y="180" fill="#8B949E" font-family="monospace" font-size="13">API Authentication:</text>
    <text x="240" y="180" fill="#FFA657" font-family="monospace" font-size="13">Laravel Sanctum stateful cookies + bearer tokens for companion app</text>
  </g>
</svg>

