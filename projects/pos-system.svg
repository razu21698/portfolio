<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#111827"/>
  <rect x="100" y="75" width="1000" height="600" rx="12" fill="#1F2937" stroke="#374151" stroke-width="2"/>
  
  <rect x="100" y="75" width="1000" height="44" rx="12" fill="#111827"/>
  <circle cx="128" cy="97" r="6" fill="#EF4444"/>
  <circle cx="148" cy="97" r="6" fill="#F59E0B"/>
  <circle cx="168" cy="97" r="6" fill="#10B981"/>
  <rect x="350" y="85" width="500" height="24" rx="6" fill="#1F2937"/>
  <text x="600" y="101" fill="#60A5FA" font-family="monospace" font-size="12" text-anchor="middle">pos.enterprise.internal • Laravel POS Engine</text>

  <!-- POS Terminal Mockup -->
  <g transform="translate(140, 150)">
    <rect width="920" height="460" rx="8" fill="#111827" stroke="#374151"/>
    
    <!-- Top terminal bar -->
    <rect width="920" height="60" rx="8" fill="#1F2937"/>
    <text x="30" y="36" fill="#3B82F6" font-family="sans-serif" font-weight="700" font-size="16">RETAIL TERMINAL 04 — REGISTER ACTIVE</text>
    <text x="750" y="36" fill="#10B981" font-family="monospace" font-size="13">● SCANNER READY (USB/HID)</text>

    <!-- Split Left Cart / Right Stats -->
    <g transform="translate(30, 80)">
      <rect width="420" height="340" rx="6" fill="#1F2937" stroke="#374151"/>
      <text x="20" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="15">Active Scanned Items</text>
      
      <rect x="20" y="60" width="380" height="45" rx="4" fill="#111827"/>
      <text x="35" y="88" fill="#E5E7EB" font-family="monospace" font-size="13">SKU-8921 // Wireless Module x1</text>
      <text x="340" y="88" fill="#10B981" font-family="monospace" font-size="13">$84.00</text>

      <rect x="20" y="115" width="380" height="45" rx="4" fill="#111827"/>
      <text x="35" y="143" fill="#E5E7EB" font-family="monospace" font-size="13">SKU-4402 // Heavy Duty Cable x2</text>
      <text x="340" y="143" fill="#10B981" font-family="monospace" font-size="13">$28.00</text>

      <text x="20" y="295" fill="#9CA3AF" font-family="sans-serif" font-size="13">Subtotal: $112.00 • Tax: $9.52</text>
      <text x="20" y="325" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="20">TOTAL: $121.52</text>
    </g>

    <g transform="translate(470, 80)">
      <rect width="420" height="340" rx="6" fill="#1F2937" stroke="#374151"/>
      <text x="20" y="35" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="15">Backend Engineering Metrics</text>
      
      <text x="20" y="75" fill="#60A5FA" font-family="monospace" font-size="13">Architecture:</text>
      <text x="20" y="100" fill="#E5E7EB" font-family="sans-serif" font-size="13">Laravel 10 REST API with atomic DB locks preventing inventory overselling.</text>

      <text x="20" y="140" fill="#60A5FA" font-family="monospace" font-size="13">Offline Resilience:</text>
      <text x="20" y="165" fill="#E5E7EB" font-family="sans-serif" font-size="13">IndexedDB buffer stores 5,000 transactions locally during WiFi loss, auto-syncing upon reconnect.</text>

      <text x="20" y="205" fill="#60A5FA" font-family="monospace" font-size="13">Printer Dispatch:</text>
      <text x="20" y="230" fill="#E5E7EB" font-family="sans-serif" font-size="13">ESC/POS thermal receipt formatting via WebSocket daemon (&lt; 200ms latency).</text>
    </g>
