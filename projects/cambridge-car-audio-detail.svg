<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#18181B"/>
  <rect x="80" y="80" width="1040" height="590" rx="16" fill="#111113" stroke="#27272A" stroke-width="2"/>
  
  <text x="140" y="150" fill="#315CFF" font-family="monospace" font-size="14" font-weight="600">ARCHITECTURE &amp; SPEED OPTIMIZATION</text>
  <text x="140" y="195" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="32">Sub-Second Asset Delivery Pipeline</text>

  <!-- Flow Boxes -->
  <g transform="translate(140, 240)">
    <!-- Step 1 -->
    <rect width="220" height="180" rx="8" fill="#1C1C21" stroke="#315CFF"/>
    <text x="24" y="40" fill="#315CFF" font-family="monospace" font-size="13">01 / REQUEST</text>
    <text x="24" y="80" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="18">Cloudflare Edge</text>
    <text x="24" y="115" fill="#A1A1AA" font-family="sans-serif" font-size="13">Early Hints (103), Brotli compression &amp; GeoDNS routing.</text>

    <!-- Arrow -->
    <path d="M 235 90 L 265 90" stroke="#3F3F46" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 2 -->
    <g transform="translate(280, 0)">
      <rect width="220" height="180" rx="8" fill="#1C1C21" stroke="#27272A"/>
      <text x="24" y="40" fill="#10B981" font-family="monospace" font-size="13">02 / CACHING</text>
      <text x="24" y="80" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="18">Nginx FastCGI</text>
      <text x="24" y="115" fill="#A1A1AA" font-family="sans-serif" font-size="13">Pre-rendered HTML cache hit in &lt; 40ms without PHP invoke.</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(560, 0)">
      <rect width="220" height="180" rx="8" fill="#1C1C21" stroke="#27272A"/>
      <text x="24" y="40" fill="#F59E0B" font-family="monospace" font-size="13">03 / APPLICATION</text>
      <text x="24" y="80" fill="#FFFFFF" font-family="sans-serif" font-weight="700" font-size="18">PHP 8.2 + OPcache</text>
      <text x="24" y="115" fill="#A1A1AA" font-family="sans-serif" font-size="13">Precompiled bytecode execution, zero redundant DB calls.</text>
    </g>
  </g>

  <!-- Metrics row -->
  <g transform="translate(140, 480)">
    <rect width="920" height="140" rx="10" fill="#141417" stroke="#27272A"/>
    <g transform="translate(40, 40)">
      <text x="0" y="24" fill="#71717A" font-family="sans-serif" font-size="13">First Contentful Paint</text>
      <text x="0" y="65" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="32">0.82s</text>
    </g>
    <g transform="translate(260, 40)">
      <text x="0" y="24" fill="#71717A" font-family="sans-serif" font-size="13">Total Page Weight</text>
      <text x="0" y="65" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="32">420 KB</text>
    </g>
    <g transform="translate(480, 40)">
      <text x="0" y="24" fill="#71717A" font-family="sans-serif" font-size="13">Time to Interactive</text>
      <text x="0" y="65" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="32">1.1s</text>
    </g>
    <g transform="translate(700, 40)">
      <text x="0" y="24" fill="#71717A" font-family="sans-serif" font-size="13">CLS Stability</text>
      <text x="0" y="65" fill="#10B981" font-family="sans-serif" font-weight="800" font-size="32">0.00</text>
    </g>
  </g>
</svg>

