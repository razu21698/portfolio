<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080b" />
      <stop offset="50%" stop-color="#0f0f14" />
      <stop offset="100%" stop-color="#09090c" />
    </linearGradient>

    <!-- Radial Glow Volt -->
    <radialGradient id="glowVolt" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.12" />
      <stop offset="60%" stop-color="#D4FF00" stop-opacity="0" />
    </radialGradient>

    <!-- Radial Glow Emerald -->
    <radialGradient id="glowEmerald" cx="20%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="archGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.04" />
      <circle cx="60" cy="0" r="1" fill="#FFFFFF" fill-opacity="0.1" />
    </pattern>

    <!-- Wave Wireframe Gradient -->
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4FF00" stop-opacity="0.02" />
      <stop offset="50%" stop-color="#D4FF00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="1920" height="300" fill="url(#bgGrad)" />

  <!-- Ambient Color Blooms -->
  <rect width="1920" height="300" fill="url(#glowVolt)" />
  <rect width="1920" height="300" fill="url(#glowEmerald)" />

  <!-- Architectural Coordinate Grid -->
  <rect width="1920" height="300" fill="url(#archGrid)" />

  <!-- 3D Perspective Wave Wireframe Overlay (echoing Hero 3D animation) -->
  <g fill="none" stroke="url(#wireGrad)" stroke-width="1" opacity="0.65">
    <path d="M -100 280 C 300 260, 600 120, 1000 160 C 1400 200, 1700 80, 2020 120" />
    <path d="M -100 250 C 320 230, 620 100, 1020 140 C 1420 180, 1720 60, 2020 100" />
    <path d="M -100 220 C 340 200, 640 80, 1040 120 C 1440 160, 1740 40, 2020 80" />
    <path d="M -100 190 C 360 170, 660 60, 1060 100 C 1460 140, 1760 20, 2020 60" />
    <path d="M -100 310 C 280 290, 580 150, 980 190 C 1380 230, 1680 110, 2020 150" />
  </g>

  <!-- Vertical telemetry lines & crosshairs -->
  <g stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1">
    <line x1="380" y1="0" x2="380" y2="300" stroke-dasharray="4 6" />
    <line x1="1540" y1="0" x2="1540" y2="300" stroke-dasharray="4 6" />
  </g>

  <!-- High-Tech Corner Crosshair accents -->
  <g stroke="#D4FF00" stroke-opacity="0.3" stroke-width="1">
    <!-- Left crosshair -->
    <line x1="80" y1="40" x2="90" y2="40" />
    <line x1="85" y1="35" x2="85" y2="45" />
    <!-- Right crosshair -->
    <line x1="1835" y1="260" x2="1845" y2="260" />
    <line x1="1840" y1="255" x2="1840" y2="265" />
  </g>

  <!-- Vignette Fade on Bottom Edge -->
  <rect x="0" y="270" width="1920" height="30" fill="url(#bgGrad)" opacity="0.8" />
  <line x1="0" y1="300" x2="1920" y2="300" stroke="#252530" stroke-width="1" />
</svg>
