<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#141415"/>
  <defs>
    <linearGradient id="cambridge-glow" x1="0" y1="0" x2="1200" y2="750" gradientUnits="userSpaceOnUse">
      <stop stop-color="#315CFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#262629" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="750" fill="url(#grid-pattern)"/>
  <rect width="1200" height="750" fill="url(#cambridge-glow)"/>

  <!-- Browser Frame -->
  <g transform="translate(100, 75)">
    <rect width="1000" height="600" rx="12" fill="#1B1B1E" stroke="#323238" stroke-width="2"/>
    
    <!-- Window Header -->
    <rect width="1000" height="44" rx="12" fill="#232328"/>
    <circle cx="28" cy="22" r="6" fill="#EF4444"/>
    <circle cx="48" cy="22" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="22" r="6" fill="#10B981"/>
    <rect x="250" y="10" width="500" height="24" rx="6" fill="#141416"/>
    <text x="500" y="26" fill="#888890" font-family="monospace" font-size="12" text-anchor="middle">https://cambridgecar.audio</text>

    <!-- Content Area -->
    <rect x="40" y="70" width="920" height="220" rx="8" fill="#141416" stroke="#2B2B32"/>
    
    <!-- Hero Mockup Text -->
    <text x="80" y="125" fill="#315CFF" font-family="sans-serif" font-weight="700" font-size="14" letter-spacing="2">PRECISION AUTOMOTIVE SOUND</text>
    <text x="80" y="170" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="34">Bespoke Audio Craftsmanship</text>
    <text x="80" y="210" fill="#9CA3AF" font-family="sans-serif" font-size="16">Handcrafted sound systems engineered for Aston Martin, Porsche, &amp; Range Rover.</text>
    <rect x="80" y="235" width="160" height="38" rx="6" fill="#315CFF"/>
    <text x="160" y="259" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="14" text-anchor="middle">Explore Installs</text>

    <!-- Speed Metric Card -->
    <g transform="translate(620, 95)">
      <rect width="300" height="170" rx="8" fill="#1B1B20" stroke="#3B82F6" stroke-opacity="0.3"/>
      <text x="24" y="36" fill="#9CA3AF" font-family="sans-serif" font-size="13">Google Lighthouse Score</text>
      <text x="24" y="85" fill="#10B981" font-family="sans-serif" font-weight="800" font-size="44">98/100</text>
      <rect x="24" y="110" width="250" height="6" rx="3" fill="#2E2E36"/>
      <rect x="24" y="110" width="245" height="6" rx="3" fill="#10B981"/>
      <text x="24" y="145" fill="#6EE7B7" font-family="monospace" font-size="12">FCP: 0.8s • LCP: 1.1s • CLS: 0.00</text>
    </g>

    <!-- Code & Features Split -->
    <g transform="translate(40, 315)">
      <rect width="445" height="240" rx="8" fill="#141416" stroke="#2B2B32"/>
      <text x="24" y="36" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="16">Custom WordPress Architecture</text>
      <text x="24" y="75" fill="#3B82F6" font-family="monospace" font-size="13">&lt;?php</text>
      <text x="24" y="100" fill="#9CA3AF" font-family="monospace" font-size="13">// Zero page-builder bloat</text>
      <text x="24" y="125" fill="#E5E7EB" font-family="monospace" font-size="13">$installs = new WP_Query([</text>
      <text x="44" y="150" fill="#E5E7EB" font-family="monospace" font-size="13">  'post_type' =&gt; 'audio_build',</text>
      <text x="44" y="175" fill="#E5E7EB" font-family="monospace" font-size="13">  'no_found_rows' =&gt; true,</text>
      <text x="24" y="200" fill="#E5E7EB" font-family="monospace" font-size="13">]);</text>
    </g>

    <g transform="translate(515, 315)">
      <rect width="445" height="240" rx="8" fill="#141416" stroke="#2B2B32"/>
      <text x="24" y="36" fill="#FFFFFF" font-family="sans-serif" font-weight="600" font-size="16">Key Engineering Highlights</text>
      <circle cx="34" cy="75" r="4" fill="#315CFF"/>
      <text x="50" y="80" fill="#D1D5DB" font-family="sans-serif" font-size="14">Custom PHP Theme from scratch</text>
      <circle cx="34" cy="115" r="4" fill="#315CFF"/>
      <text x="50" y="120" fill="#D1D5DB" font-family="sans-serif" font-size="14">ACF Pro Flexible Grid integration</text>
      <circle cx="34" cy="155" r="4" fill="#315CFF"/>
      <text x="50" y="160" fill="#D1D5DB" font-family="sans-serif" font-size="14">Server-level OPcache &amp; Nginx tuning</text>
      <circle cx="34" cy="195" r="4" fill="#315CFF"/>
      <text x="50" y="200" fill="#D1D5DB" font-family="sans-serif" font-size="14">LocalBusiness Structured Data (JSON-LD)</text>
    </g>
  </g>
</svg>

