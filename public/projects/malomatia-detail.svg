<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0C131F"/>
  <rect x="80" y="80" width="1040" height="590" rx="16" fill="#111B2C" stroke="#1E2F4C" stroke-width="2"/>
  
  <text x="140" y="145" fill="#38BDF8" font-family="monospace" font-size="14" font-weight="600">ENTERPRISE INFRASTRUCTURE &amp; SECURITY</text>
  <text x="140" y="190" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="30">High-Availability Reverse Proxy &amp; Hardening</text>

  <g transform="translate(140, 240)">
    <rect width="920" height="380" rx="8" fill="#0B1320" stroke="#1E2F4C"/>
    
    <text x="30" y="40" fill="#60A5FA" font-family="monospace" font-size="13"># /etc/nginx/conf.d/malomatia-security.conf</text>
    <text x="30" y="75" fill="#E2E8F0" font-family="monospace" font-size="13">add_header X-Frame-Options "SAMEORIGIN" always;</text>
    <text x="30" y="105" fill="#E2E8F0" font-family="monospace" font-size="13">add_header X-XSS-Protection "1; mode=block" always;</text>
    <text x="30" y="135" fill="#E2E8F0" font-family="monospace" font-size="13">add_header X-Content-Type-Options "nosniff" always;</text>
    <text x="30" y="165" fill="#E2E8F0" font-family="monospace" font-size="13">add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline'" always;</text>
    <text x="30" y="195" fill="#E2E8F0" font-family="monospace" font-size="13">add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;</text>
    
    <text x="30" y="240" fill="#38BDF8" font-family="monospace" font-size="13"># FastCGI Cache Configuration for Enterprise WordPress</text>
    <text x="30" y="270" fill="#E2E8F0" font-family="monospace" font-size="13">fastcgi_cache_path /var/run/nginx-cache levels=1:2 keys_zone=WORDPRESS:100m inactive=60m;</text>
    <text x="30" y="300" fill="#E2E8F0" font-family="monospace" font-size="13">fastcgi_cache_key "$scheme$request_method$host$request_uri";</text>
    <text x="30" y="330" fill="#E2E8F0" font-family="monospace" font-size="13">fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;</text>
  </g>
</svg>

