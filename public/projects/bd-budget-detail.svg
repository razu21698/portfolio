<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#151518"/>
  <rect x="80" y="80" width="1040" height="590" rx="16" fill="#1C1C22" stroke="#2E2E38" stroke-width="2"/>
  
  <text x="140" y="145" fill="#EC4899" font-family="monospace" font-size="14" font-weight="600">WOOCOMMERCE SPEED BENCHMARKING</text>
  <text x="140" y="190" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="30">Checkout Latency &amp; Memory Consumption Audit</text>

  <!-- Comparison Bars -->
  <g transform="translate(140, 240)">
    <!-- Metric 1 -->
    <text x="0" y="25" fill="#E5E7EB" font-family="sans-serif" font-weight="600" font-size="16">Cart-to-Payment Processing Latency</text>
    <rect x="0" y="45" width="700" height="32" rx="6" fill="#2A2A34"/>
    <rect x="0" y="45" width="580" height="32" rx="6" fill="#EF4444" fill-opacity="0.8"/>
    <text x="600" y="67" fill="#FCA5A5" font-family="sans-serif" font-size="13">Legacy Store: 4,400ms</text>

    <rect x="0" y="90" width="700" height="32" rx="6" fill="#2A2A34"/>
    <rect x="0" y="90" width="140" height="32" rx="6" fill="#10B981"/>
    <text x="160" y="112" fill="#6EE7B7" font-family="sans-serif" font-weight="700" font-size="13">After Optimization: 680ms (-84%)</text>
  </g>

  <g transform="translate(140, 410)">
    <!-- Metric 2 -->
    <text x="0" y="25" fill="#E5E7EB" font-family="sans-serif" font-weight="600" font-size="16">PHP Memory Footprint per Transaction</text>
    <rect x="0" y="45" width="700" height="32" rx="6" fill="#2A2A34"/>
    <rect x="0" y="45" width="520" height="32" rx="6" fill="#F59E0B" fill-opacity="0.8"/>
    <text x="540" y="67" fill="#FCD34D" font-family="sans-serif" font-size="13">Legacy Store: 168 MB / worker</text>

    <rect x="0" y="90" width="700" height="32" rx="6" fill="#2A2A34"/>
    <rect x="0" y="90" width="190" height="32" rx="6" fill="#3B82F6"/>
    <text x="210" y="112" fill="#93C5FD" font-family="sans-serif" font-weight="700" font-size="13">Tuned Architecture: 46 MB (-72%)</text>
  </g>

  <!-- Summary Footer -->
  <g transform="translate(140, 580)">
    <rect width="920" height="60" rx="6" fill="#141418"/>
    <text x="30" y="36" fill="#9CA3AF" font-family="sans-serif" font-size="14">Result: Allowed client to absorb flash sale peaks with zero order drops and zero hosting infrastructure cost increases.</text>
  </g>
</svg>

